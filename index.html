<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f3ea" />
  <title>What Should I Eat?</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section id="screen-home" class="screen active">
      <div class="hero-emoji">🍜</div>
      <p class="eyebrow">A tiny decision tool</p>
      <h1>What should<br />I eat?</h1>
      <p class="subtitle">Stop scrolling. Answer three tiny questions and let us choose dinner for you.</p>
      <button class="primary" id="startBtn">Help me decide <span>→</span></button>
      <p class="microcopy">For people who say “anything is fine” and then reject every option.</p>
    </section>

    <section id="screen-question" class="screen">
      <div class="topbar">
        <button class="icon-btn" id="backBtn" aria-label="Back">←</button>
        <div class="progress"><span id="progressBar"></span></div>
        <span id="stepText">1 / 3</span>
      </div>
      <div class="question-wrap">
        <p class="eyebrow" id="questionEyebrow">Question 1</p>
        <h2 id="questionTitle"></h2>
        <p class="question-subtitle" id="questionSubtitle"></p>
        <div class="options" id="options"></div>
      </div>
    </section>

    <section id="screen-result" class="screen">
      <button class="back-home" id="homeBtn">← Start over</button>
      <div class="result-card">
        <p class="eyebrow">Tonight's answer</p>
        <div class="result-emoji" id="resultEmoji">🍜</div>
        <h2 id="resultName">Ramen</h2>
        <p id="resultDescription"></p>
        <div class="tags" id="resultTags"></div>
      </div>
      <div class="result-actions">
        <button class="primary" id="againBtn">Try again <span>↻</span></button>
        <button class="secondary" id="keepBtn">I'll have this ✓</button>
      </div>
      <p class="tiny-note" id="savedMessage"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
